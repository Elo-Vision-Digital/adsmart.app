name: CI

on:
  push:
    branches: [main, migrate]
  pull_request:
    branches: [main, migrate]

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # Lint non-blocking: Phase 2 will migrate this project from ESLint 8 +
      # eslint-config-google (strict style, thousands of pre-existing
      # violations) to ESLint 9 flat. Until then, lint-fail would block
      # every PR on unrelated style drift.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

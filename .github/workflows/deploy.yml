name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy → adsmart-web-dev (develop)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-deploy-dev-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-deploy-dev-

      - name: Write functions/.env (defineString params consumed by firebase-tools at deploy time)
        run: |
          {
            echo "GOOGLE_ADS_CLIENT_ID=$GOOGLE_ADS_CLIENT_ID"
            echo "GOOGLE_ADS_REDIRECT_URI=$GOOGLE_ADS_REDIRECT_URI"
            echo "GOOGLE_ADS_REDIRECT_URI_DEV=$GOOGLE_ADS_REDIRECT_URI_DEV"
            echo "META_ADS_APP_ID=$META_ADS_APP_ID"
            echo "META_ADS_REDIRECT_URI=$META_ADS_REDIRECT_URI"
            echo "META_ADS_REDIRECT_URI_DEV=$META_ADS_REDIRECT_URI_DEV"
          } > functions/.env
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ vars.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_REDIRECT_URI: ${{ vars.GOOGLE_ADS_REDIRECT_URI }}
          GOOGLE_ADS_REDIRECT_URI_DEV: ${{ vars.GOOGLE_ADS_REDIRECT_URI_DEV }}
          META_ADS_APP_ID: ${{ vars.META_ADS_APP_ID }}
          META_ADS_REDIRECT_URI: ${{ vars.META_ADS_REDIRECT_URI }}
          META_ADS_REDIRECT_URI_DEV: ${{ vars.META_ADS_REDIRECT_URI_DEV }}

      - name: Build all (web + functions)
        run: bun run build:all

      - name: Test Firestore rules (emulator)
        run: bash scripts/firebase/test-rules.sh

      - name: Deploy to dev
        run: bunx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project adsmart-web-dev --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-prod:
    name: Deploy → adsmart-web (main)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-deploy-prod-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-deploy-prod-

      - name: Write functions/.env (defineString params consumed by firebase-tools at deploy time)
        run: |
          {
            echo "GOOGLE_ADS_CLIENT_ID=$GOOGLE_ADS_CLIENT_ID"
            echo "GOOGLE_ADS_REDIRECT_URI=$GOOGLE_ADS_REDIRECT_URI"
            echo "GOOGLE_ADS_REDIRECT_URI_DEV=$GOOGLE_ADS_REDIRECT_URI_DEV"
            echo "META_ADS_APP_ID=$META_ADS_APP_ID"
            echo "META_ADS_REDIRECT_URI=$META_ADS_REDIRECT_URI"
            echo "META_ADS_REDIRECT_URI_DEV=$META_ADS_REDIRECT_URI_DEV"
          } > functions/.env
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ vars.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_REDIRECT_URI: ${{ vars.GOOGLE_ADS_REDIRECT_URI }}
          GOOGLE_ADS_REDIRECT_URI_DEV: ${{ vars.GOOGLE_ADS_REDIRECT_URI_DEV }}
          META_ADS_APP_ID: ${{ vars.META_ADS_APP_ID }}
          META_ADS_REDIRECT_URI: ${{ vars.META_ADS_REDIRECT_URI }}
          META_ADS_REDIRECT_URI_DEV: ${{ vars.META_ADS_REDIRECT_URI_DEV }}

      - name: Build all (web + functions)
        run: bun run build:all

      - name: Test Firestore rules (emulator)
        run: bash scripts/firebase/test-rules.sh

      - name: Deploy to production
        run: bunx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project adsmart-web --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
